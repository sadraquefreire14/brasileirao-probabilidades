name: Atualizar dados e publicar

on:
  schedule:
    # A cada 2 horas (UTC). Cobre jogos à tarde e à noite no horário de Brasília.
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['src/data/**', '**.md']

permissions:
  contents: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements-dev.txt

      - name: Testes do modelo
        run: pytest -q

      - name: Buscar partidas e simular
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SEASON: ${{ vars.SEASON || '2026' }}
        run: python -m ingest.run

      - name: Versionar dados se mudaram
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data; then
            echo "Sem mudanças nos dados."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "dados: atualização $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build do site
        run: |
          npm ci
          npm run build

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'brasileirao-probabilidades' }} --branch=main
